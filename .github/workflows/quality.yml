name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - name: Tests and static analysis
        run: composer check
      - name: Dependency audit
        run: composer audit --locked --no-interaction
      - name: Dependency-free smoke test
        run: |
          php tools/smoke-test.php

